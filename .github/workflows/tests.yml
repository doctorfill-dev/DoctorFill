name: tests

# À déclarer comme « required status checks » sur main (Settings → Branches) :
# lint, orchestrator, marker-ocr, frontend. Sans cette règle, un merge reste
# possible malgré une CI rouge.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"
      # Erreurs seulement (noms indéfinis, imports inutiles, syntaxe) : pas de style imposé.
      - run: ruff check --select F,E9 services eval

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Celle de l'image nvcr.io/nvidia/pytorch de l'orchestrateur.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Sans GPU ni service : OCR, TEI et vLLM sont simulés. Couvre les 21
      # formulaires du catalogue et les 21 dossiers de eval/dossiers/.
      - run: python -m pytest tests -q --cov=. --cov-report=term:skip-covered --cov-fail-under=70

  marker-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marker_ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # textlayer.py seul : marker et ses modèles ne sont pas nécessaires.
      - run: pip install "pypdfium2>=4.30.0,<6.0" "pikepdf>=9.0.0,<11.0" "pytest>=8.0,<10.0"
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
