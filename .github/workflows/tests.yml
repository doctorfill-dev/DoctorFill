name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Celle de l'image nvcr.io/nvidia/pytorch de l'orchestrateur.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Sans GPU ni service : OCR, TEI et vLLM sont simulés (tests/test_pipeline.py).
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
