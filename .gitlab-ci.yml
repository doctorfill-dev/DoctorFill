# CI de DoctorFill. GitLab est le dépôt principal ; GitHub n'en est qu'un
# miroir, sans workflow.
#
# Pour qu'une MR rouge ne puisse pas être fusionnée : Settings → Merge requests
# → « Pipelines must succeed ». Voir docs/wiki/Tests.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Une branche avec une MR ouverte : seul le pipeline de la MR tourne.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"
    # Une version publiée (tag vX.Y.Z) repasse les tests.
    - if: $CI_COMMIT_TAG

stages:
  - test
  - eval

default:
  # Un nouveau push annule le pipeline en cours sur la même branche.
  interruptible: true

# Le tag d'une version doit correspondre au fichier VERSION : v1.2.3 pour 1.2.3.
version-tag:
  stage: test
  image: alpine:3
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if [ "$CI_COMMIT_TAG" != "v$(cat VERSION)" ]; then
        echo "Tag $CI_COMMIT_TAG, mais VERSION contient $(cat VERSION)"
        exit 1
      fi

lint:
  stage: test
  image: python:3.12
  script:
    - pip install --quiet "ruff==0.16.9"
    # Erreurs seulement (noms indéfinis, imports inutiles, syntaxe) : pas de style imposé.
    - ruff check --select F,E9 services eval

orchestrator:
  stage: test
  # Celle de l'image nvcr.io/nvidia/pytorch de l'orchestrateur.
  image: python:3.12
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key:
      files:
        - services/orchestrator/requirements.txt
        - services/orchestrator/requirements-dev.txt
    paths:
      - .cache/pip
  script:
    - cd services/orchestrator
    - pip install --quiet -r requirements-dev.txt
    # Sans GPU ni service : OCR, TEI et vLLM sont simulés. Couvre les 21
    # formulaires du catalogue, les 25 dossiers de eval/dossiers/, les routes
    # HTTP (clé API, jetons, upload) et les reprises sur panne des services.
    - >
      python -m pytest tests -q --cov=. --cov-report=term:skip-covered
      --cov-report=xml:coverage.xml --junitxml=report.xml --cov-fail-under=70
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      # Lignes couvertes affichées dans le diff de la MR, tests en échec dans son onglet Tests.
      coverage_report:
        coverage_format: cobertura
        path: services/orchestrator/coverage.xml
      junit: services/orchestrator/report.xml

marker-ocr:
  stage: test
  image: python:3.12
  script:
    - cd services/marker_ocr
    # Ni marker ni ses modèles : app.py est testé avec un marker simulé
    # (tests/test_app.py), textlayer.py avec de vrais PDF construits par pikepdf.
    - >
      pip install --quiet "pypdfium2>=4.30.0,<6.0" "pikepdf>=9.0.0,<11.0"
      "fastapi>=0.115.0,<1.0" "python-multipart>=0.0.18,<1.0" "httpx>=0.27.0,<1.0"
      "pytest>=8.0,<10.0" "pytest-cov>=5.0,<8.0"
    - >
      python -m pytest tests -q --cov=. --cov-report=term
      --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/marker_ocr/coverage.xml
      junit: services/marker_ocr/report.xml

tei:
  stage: test
  image: python:3.12
  script:
    - cd services/tei
    # torch et sentence-transformers sont simulés (tests/test_app.py) : pas de
    # GPU, pas de téléchargement de modèle.
    - >
      pip install --quiet "fastapi>=0.115.0,<1.0" "httpx>=0.27.0,<1.0"
      "pytest>=8.0,<10.0" "pytest-cov>=5.0,<8.0"
    - >
      python -m pytest tests -q --cov=. --cov-report=term
      --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/tei/coverage.xml
      junit: services/tei/report.xml

frontend:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    # The build also type-checks the Pages Function (functions/).
    - npm run build
    # Pages Function /api/* proxy: header filtering, fixed upstream, streaming.
    - npm run test:functions

# Non-régression de la qualité d'extraction contre le vrai modèle.
#
# Les runners partagés de GitLab n'ont pas de GPU : ce job ne tourne que sur un
# runner enregistré sur le DGX Spark avec le tag `dgx`, et vise le backend
# déployé sur cette machine. Lancement manuel (« Run job » dans le pipeline de
# la MR), typiquement sur une MR qui touche aux prompts, au modèle, au
# découpage ou aux templates. Variables modifiables au lancement : EVAL_API,
# EVAL_FORMS (formulaires ou dossiers, séparés par des espaces, vide = les 25 dossiers).
#
# La référence (eval/baseline.json) se met à jour par MR, après validation :
#   python eval/regression.py --api http://localhost:8080 --api-key $KEY --update-baseline
eval:
  stage: eval
  tags:
    - dgx
  rules:
    - when: manual
      allow_failure: true
  interruptible: false
  timeout: 3h
  variables:
    EVAL_API: http://localhost:8080
    EVAL_FORMS: ""
  script:
    # truth.py n'importe que la partie pure de l'orchestrateur (core/fields, core/provenance).
    # pypdf lit le PDF livré ; fpdf2 génère les PDF des variantes de dossiers.
    - python3 -m pip install --user "httpx>=0.27.0,<1.0" "pypdf>=5.0.0,<7.0" "fpdf2>=2.8.0,<3.0"
    - |
      python3 eval/regression.py --api "$EVAL_API" --api-key "$DOCTORFILL_API_KEY" \
        ${EVAL_FORMS:+--forms $EVAL_FORMS} --report report.md --json results.json
  after_script:
    - cat report.md || true
  artifacts:
    when: always
    name: eval-report
    paths:
      - report.md
      - results.json
