# CI de DoctorFill. GitLab est le dépôt principal ; GitHub n'en est qu'un
# miroir, sans workflow.
#
# Pour qu'une MR rouge ne puisse pas être fusionnée : Settings → Merge requests
# → « Pipelines must succeed ». Voir docs/wiki/Tests.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Une branche avec une MR ouverte : seul le pipeline de la MR tourne.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"
    # Une version publiée (tag vX.Y.Z) repasse les tests.
    - if: $CI_COMMIT_TAG

stages:
  - test
  - eval

default:
  # Un nouveau push annule le pipeline en cours sur la même branche.
  interruptible: true

# Le tag d'une version doit correspondre au fichier VERSION : v1.2.3 pour 1.2.3.
version-tag:
  stage: test
  image: alpine:3
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if [ "$CI_COMMIT_TAG" != "v$(cat VERSION)" ]; then
        echo "Tag $CI_COMMIT_TAG, mais VERSION contient $(cat VERSION)"
        exit 1
      fi

lint:
  stage: test
  image: python:3.12
  script:
    - pip install --quiet "ruff==0.16.9"
    # Erreurs seulement (noms indéfinis, imports inutiles, syntaxe) : pas de style imposé.
    - ruff check --select F,E9 services eval

orchestrator:
  stage: test
  # Celle de l'image nvcr.io/nvidia/pytorch de l'orchestrateur.
  image: python:3.12
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key:
      files:
        - services/orchestrator/requirements.txt
        - services/orchestrator/requirements-dev.txt
    paths:
      - .cache/pip
  script:
    - cd services/orchestrator
    - pip install --quiet -r requirements-dev.txt
    # Sans GPU ni service : OCR, TEI et vLLM sont simulés. Couvre les 21
    # formulaires du catalogue et les 25 dossiers de eval/dossiers/.
    - python -m pytest tests -q --cov=. --cov-report=term:skip-covered --cov-fail-under=70
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'

marker-ocr:
  stage: test
  image: python:3.12
  script:
    - cd services/marker_ocr
    # textlayer.py seul : marker et ses modèles ne sont pas nécessaires.
    - pip install --quiet "pypdfium2>=4.30.0,<6.0" "pikepdf>=9.0.0,<11.0" "pytest>=8.0,<10.0"
    - python -m pytest tests -q

frontend:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    # The build also type-checks the Pages Function (functions/).
    - npm run build
    # Pages Function /api/* proxy: header filtering, fixed upstream, streaming.
    - npm run test:functions

# Non-régression de la qualité d'extraction contre le vrai modèle (issue 39).
#
# Règles de sécurité (audit S12) :
# - jamais dans un pipeline de MR : le code d'une MR ne s'exécute pas sur un
#   runner privilégié. Seulement sur la branche par défaut et sur un tag
#   protégé, lancé à la main ;
# - runner dédié, hors de la machine qui traite les dossiers, avec le tag
#   `eval-isolated`, qui ne joint que l'API ;
# - EVAL_API et DOCTORFILL_API_KEY sont des variables protégées (et masquée
#   pour la clé) du projet. La clé est lue dans l'environnement par le script,
#   jamais passée en argument (visible dans `ps`) ;
# - --no-values : rapport et artefacts sans aucune valeur extraite ou
#   attendue, scores seulement. Rien n'est affiché du rapport après le job.
#
# Variable modifiable au lancement : EVAL_FORMS (formulaires ou dossiers,
# séparés par des espaces, vide = les 25 dossiers).
#
# La référence (eval/baseline.json) se met à jour par MR, après validation, en
# local (DOCTORFILL_API_KEY dans l'environnement) :
#   python eval/regression.py --api <URL> --update-baseline
# Les seuils par catégorie (thresholds.categories) se règlent à la main.
eval:
  stage: eval
  tags:
    - eval-isolated
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
    - when: never
  interruptible: false
  timeout: 3h
  variables:
    EVAL_FORMS: ""
  script:
    - 'test -n "$EVAL_API" || { echo "Variable EVAL_API absente (variable protégée du projet)."; exit 1; }'
    - 'test -n "$DOCTORFILL_API_KEY" || { echo "Variable DOCTORFILL_API_KEY absente (variable protégée et masquée)."; exit 1; }'
    # truth.py n'importe que la partie pure de l'orchestrateur (core/fields, core/provenance).
    # pypdf lit le PDF livré ; fpdf2 génère les PDF des variantes de dossiers.
    - python3 -m pip install --user "httpx>=0.27.0,<1.0" "pypdf>=5.0.0,<7.0" "fpdf2>=2.8.0,<3.0"
    - |
      python3 eval/regression.py --api "$EVAL_API" --no-values \
        ${EVAL_FORMS:+--forms $EVAL_FORMS} --report report.md --json results.json
  artifacts:
    when: always
    name: eval-report
    expire_in: 30 days
    paths:
      - report.md
      - results.json
