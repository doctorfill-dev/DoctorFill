# services/docker-compose.yml
services:
  vllm:
    container_name: df-services-vllm
    image: nvcr.io/nvidia/vllm:25.11-py3
    # Le GB10 est limité par sa bande passante mémoire (273 Go/s) : à concurrence 1
    # on plafonne vers 21 tok/s, à 32 on atteint ~156 tok/s. La charge de DoctorFill
    # est un lot de requêtes d'extraction simultanées, donc c'est le débit agrégé qui
    # compte, pas la latence par flux — d'où max-num-seqs relevé de 8 à 24.
    # --enable-prefix-caching : tous les batchs d'un job partagent le même prompt
    # système et le même bloc de synthèse, préfilé une seule fois.
    command: >
      vllm serve Qwen/Qwen2.5-14B-Instruct-AWQ
      --max-model-len 32768
      --gpu-memory-utilization 0.70
      --max-num-seqs 24
      --enable-chunked-prefill
      --enable-prefix-caching
    ipc: host
    # [SEC-13] Port interne uniquement (pas exposé sur l'hôte)
    expose:
      - "8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # nvidia-smi -L en préambule : un conteneur peut perdre l'accès à /dev/nvidia*
      # (cgroups réinitialisés par un daemon-reload de l'hôte) sans que le process
      # meure — il garde sa VRAM et répond /health alors que toute inférence échoue.
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s  # vLLM met du temps à charger le modèle
    restart: unless-stopped

  marker_ocr:
    container_name: df-services-marker_ocr
    build:
      context: ./marker_ocr
    image: df-image-marker
    # [SEC-13] Port interne uniquement (pas exposé sur l'hôte)
    expose:
      - "8082"
    volumes:
      # Persister le cache des modèles Marker (~3 GB) entre les rebuilds
      - ~/.cache/datalab:/root/.cache/datalab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Voir le commentaire du healthcheck vllm : sans ce préambule GPU, marker
      # reste "healthy" alors que surya échoue en "CUDA: operation not permitted".
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s  # Chargement des modèles vision en VRAM
    restart: unless-stopped

  tei:
    container_name: df-services-tei
    build:
      context: ./tei
    image: doctorfill/tei-service:latest
    # [SEC-13] Port interne uniquement (pas exposé sur l'hôte)
    expose:
      - "8081"
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Idem vllm/marker : le préambule GPU rend visible une perte de /dev/nvidia*.
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 500s  # Chargement embedding + reranker
    restart: unless-stopped

  orchestrator:
    container_name: df-services-orchestrator
    build:
      context: ./orchestrator
      args:
        # Renseigner au build : APP_VERSION=$(cat ../VERSION) docker compose up -d --build
        APP_VERSION: ${APP_VERSION:-}
    image: doctorfill/orchestrator:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      vllm:
        condition: service_healthy
      marker_ocr:
        condition: service_healthy
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped